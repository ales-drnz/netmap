name: netmap
description: "Netmap: a live map and dashboard for your ZeroTier network."
publish_to: 'none'
# the real version is package.json's, passed at build time (scripts/build-web.mjs)
version: 0.0.0

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  material_color_utilities: ^0.13.0
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.11.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # bundled: the network is private, nothing is fetched from the internet
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
