<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <title>Netmap</title>
    <script>
      // manually chosen theme, applied before first paint: no light flash
      try { const t = localStorage.getItem('nm-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
